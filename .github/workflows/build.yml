name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare environment & Fix entry point
        run: |
          mkdir -p www
          # Если внутри www есть файл index без расширения, переименовываем в index.html
          if [ -f www/index ] && [ ! -f www/index.html ]; then
            mv www/index www/index.html
          fi
          
          # Если index.html так и не найден, создаем заглушку, чтобы сборка не папада
          if [ ! -f www/index.html ]; then
            echo '<!DOCTYPE html><html><body><h1>Game loaded</h1></body></html>' > www/index.html
          fi

          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android Platform and Build
        run: |
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snakegame-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
